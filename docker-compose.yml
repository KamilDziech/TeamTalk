services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teamtalk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teamtalk123}
      POSTGRES_DB: ${DB_NAME:-teamtalk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teamtalk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
