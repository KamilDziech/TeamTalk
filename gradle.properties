org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kompilator Kotlina chodzi we WŁASNYM procesie i NIE dziedziczy limitu wyżej —
# bez tej linijki bierze domyślne ~2 GB i od 2026-09-09 przestało to wystarczać:
# `:app:compileDebugKotlin` padał na „Not enough memory to run compilation"
# (najpierw mylącym „Daemon compilation failed: null") przy generowaniu kodu
# z `DealDetailViewModel.kt` — karta deala ma szesnaście zakładek w jednym
# ViewModelu, więc to najcięższy plik projektu.
kotlin.daemon.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
